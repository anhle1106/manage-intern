<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning Roadmap - DevOps Intern Platform</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .topic-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 22px;
      margin-bottom: 20px;
      transition: all 0.2s ease;
    }
    .topic-card.completed {
      border-color: var(--accent-emerald);
      background-color: rgba(16, 185, 129, 0.04);
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.08);
    }
    .topic-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .ticket-checkbox {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      user-select: none;
    }
    .ticket-checkbox input[type="checkbox"] {
      width: 22px;
      height: 22px;
      accent-color: var(--accent-emerald);
      cursor: pointer;
    }
    .topic-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-primary);
      transition: all 0.2s;
    }
    .topic-card.completed .topic-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }
    .concept-tag {
      display: inline-block;
      background-color: var(--primary-alpha);
      color: var(--primary);
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      margin-right: 6px;
      margin-top: 6px;
    }
    .subtopics-container {
      margin-top: 14px;
    }
    .subtopic-ticket {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      background-color: var(--bg-primary);
      border-radius: var(--radius-md);
      margin-top: 10px;
      border: 1px solid var(--border-color);
      transition: all 0.2s ease;
    }
    .subtopic-ticket:hover {
      border-color: var(--primary);
    }
    .subtopic-ticket.done {
      border-color: rgba(16, 185, 129, 0.3);
      background-color: rgba(16, 185, 129, 0.03);
    }
    .subtopic-ticket input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent-emerald);
      cursor: pointer;
      margin-top: 2px;
    }
    .subtopic-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .subtopic-ticket.done .subtopic-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }
    .completed-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background-color: rgba(16, 185, 129, 0.15);
      color: var(--accent-emerald);
      padding: 4px 10px;
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 700;
    }

    /* Audit Review Card Styling */
    .audit-review-box {
      margin-top: 16px;
      margin-left: 34px;
      padding: 14px 16px;
      background-color: var(--bg-primary);
      border-left: 4px solid var(--primary);
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
    }
    .audit-review-box.passed {
      border-left-color: var(--accent-emerald);
      background-color: rgba(16, 185, 129, 0.05);
    }
    .audit-review-box.needs_improvement {
      border-left-color: var(--accent-amber);
      background-color: rgba(245, 158, 11, 0.05);
    }
    .audit-review-box.excellent {
      border-left-color: var(--accent-purple);
      background-color: rgba(168, 85, 247, 0.05);
    }
    .audit-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      margin-left: 8px;
    }
    .audit-badge.passed { background-color: rgba(16, 185, 129, 0.2); color: var(--accent-emerald); }
    .audit-badge.needs_improvement { background-color: rgba(245, 158, 11, 0.2); color: var(--accent-amber); }
    .audit-badge.excellent { background-color: rgba(168, 85, 247, 0.2); color: var(--accent-purple); }

    /* Audit Checklist UI */
    .audit-checklist-box {
      margin-top: 8px;
      padding: 10px 12px;
      background-color: rgba(56, 189, 248, 0.04);
      border: 1px dashed rgba(56, 189, 248, 0.25);
      border-radius: var(--radius-md);
    }
    .audit-question-item {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 6px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .audit-question-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    .weight-badge {
      font-size: 10px;
      font-weight: 700;
      background-color: var(--primary-alpha);
      color: var(--primary);
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 6px;
    }

    .onboarding-nav-pills {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
    }
    .onboarding-pill {
      padding: 10px 18px;
      background-color: var(--bg-secondary);
      color: var(--text-secondary);
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .onboarding-pill:hover {
      background-color: rgba(56, 189, 248, 0.1);
      color: var(--primary);
      border-color: var(--primary);
    }
    .onboarding-pill.active {
      background-color: var(--primary);
      color: #0f172a;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div id="sidebar" class="sidebar"></div>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h1 class="page-title">Learning Roadmap</h1>
          <p class="page-subtitle">Structured learning topics and audit questions for your onboarding group</p>
        </div>
        <div style="display:flex; gap:12px; align-items:center;">
          <div id="intern-selector-wrapper" style="min-width: 220px; display: none;">
            <label style="font-size:11px; color:var(--text-muted); font-weight:700; display:block; margin-bottom:4px;">AUDITED INTERN:</label>
            <select id="roadmap-intern-filter" class="form-control" onchange="filterRoadmapByIntern(this.value)">
              <option value="">-- Select Intern --</option>
            </select>
          </div>
          <div style="min-width: 240px; display:none;">
            <label style="font-size:11px; color:var(--text-muted); font-weight:700; display:block; margin-bottom:4px;">ONBOARDING BATCH:</label>
            <select id="roadmap-batch-filter" class="form-control" onchange="filterRoadmapByBatch(this.value)">
              <option value="">All Onboarding Batches</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Onboarding Group Nav Pills Bar for Learning Roadmap -->
      <div id="learning-nav-pills" class="onboarding-nav-pills"></div>

      <div class="card-section">
        <div class="card-title" style="display:flex; justify-content:space-between; align-items:center;">
          <span>Overall Completion Progress</span>
          <span id="roadmap-progress-percent" style="font-size:14px; font-weight:700; color:var(--accent-emerald);">0%</span>
        </div>
        <div class="progress-container" style="height:12px; margin-top:8px;">
          <div id="roadmap-progress-bar" class="progress-bar" style="width: 0%; background: linear-gradient(90deg, var(--primary), var(--accent-emerald));"></div>
        </div>
        <div id="roadmap-progress-text" style="font-size:13px; color:var(--text-secondary); margin-top:8px;">Loading progress...</div>
      </div>

      <div id="topics-list"></div>
    </main>
  </div>

  <!-- TechLead Audit Review Modal -->
  <div id="audit-modal" class="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="audit-modal-title">📝 TechLead Module Audit Review</h3>
        <button class="modal-close" onclick="closeModal('audit-modal')">&times;</button>
      </div>
      <form id="audit-review-form">
        <input type="hidden" id="audit-topic-id">
        
        <div class="form-group">
          <label class="form-label">Module / Topic</label>
          <input type="text" id="audit-topic-title" class="form-control" readonly style="background-color:var(--bg-primary);">
        </div>

        <div class="form-group">
          <label class="form-label">Audited Intern</label>
          <input type="text" id="audit-intern-name" class="form-control" readonly style="background-color:var(--bg-primary);">
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
          <div class="form-group">
            <label class="form-label">Audit Evaluation</label>
            <select id="audit-status" class="form-control" required>
              <option value="PASSED">PASSED (Đạt)</option>
              <option value="EXCELLENT">EXCELLENT (Xuất Sắc)</option>
              <option value="NEEDS_IMPROVEMENT">NEEDS IMPROVEMENT (Cần Cải Thiện)</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Score (0 - 10)</label>
            <input type="number" id="audit-score" class="form-control" min="0" max="10" step="0.5" placeholder="8.5">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">TechLead Feedback & Commentary</label>
          <textarea id="audit-feedback" class="form-control" rows="4" placeholder="Nêu rõ ưu điểm, điểm cần cải thiện cho Intern ở Module này..." required></textarea>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('audit-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Audit Review</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/learning.js"></script>
</body>
</html>
