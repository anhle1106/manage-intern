<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management - DevOps Intern Platform</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-container">
    <div id="sidebar" class="sidebar"></div>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h1 class="page-title">User Management</h1>
          <p class="page-subtitle">Manage platform accounts, roles, and access controls</p>
        </div>
        <div>
          <button class="btn btn-primary" onclick="openModal('create-user-modal')">+ Create User</button>
        </div>
      </div>

      <div class="card-section">
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>Full Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="users-table-body">
              <tr><td colspan="5" style="text-align:center; color:var(--text-muted);">Loading users...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Create User Modal -->
  <div id="create-user-modal" class="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Create New User</h3>
        <button class="modal-close" onclick="closeModal('create-user-modal')">&times;</button>
      </div>
      <form id="create-user-form">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" id="user-name" class="form-control" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="user-email" class="form-control" placeholder="john@devops.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="user-pass" class="form-control" placeholder="••••••••" required>
        </div>
        <div class="form-group">
          <label class="form-label">Role</label>
          <select id="user-role" class="form-control" required>
            <option value="INTERN" selected>INTERN</option>
            <option value="LEADER">LEADER</option>
            <option value="ADMIN">ADMIN</option>
          </select>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('create-user-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Create User</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/users.js"></script>
</body>
</html>
