<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule - DevOps Intern Platform</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
</head>
<body>
  <div class="app-container">
    <div id="sidebar" class="sidebar"></div>

    <main class="main-content">
      <div class="page-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:12px;">
        <div>
          <h1 class="page-title">University & Intern Schedule</h1>
          <p class="page-subtitle">Manage class schedules, leave time, and view all occupied time slots</p>
        </div>
        <div id="schedule-actions">
          <button class="btn btn-primary" onclick="openModal('add-schedule-modal')">+ Add Schedule</button>
        </div>
      </div>

      <div id="intern-selector-container" class="card-section" style="padding:18px 24px; margin-bottom:24px;">
        <div style="display:flex; align-items:center; justify-style:space-between; gap:16px; flex-wrap:wrap;">
          <div>
            <label class="form-label" for="intern-select" style="margin-bottom:6px; font-weight:700;">👁️ Chế độ xem Lịch bận & Chuyên cần:</label>
            <select id="intern-select" class="form-control" style="min-width:320px;" onchange="loadInternSchedule(this.value)">
              <option value="ALL">🌐 Tất cả thực tập sinh (Xem tổng thể toàn bộ đợt)</option>
              <option value="MY_SELF">👤 Cá nhân tôi</option>
            </select>
          </div>
          <div id="schedule-filter-legend" style="display:flex; gap:12px; font-size:12px; flex-wrap:wrap; margin-top:20px;">
            <!-- User color legends dynamically populated -->
          </div>
        </div>
      </div>

      <div class="card-section">
        <div id="calendar-container" style="min-height: 580px;"></div>
      </div>

      <!-- Schedule Entries List with Delete Button -->
      <div class="card-section" style="margin-top:24px;">
        <div class="card-title" style="margin-bottom:16px;">📋 Danh sách Chi tiết Lịch bận Hiển thị</div>
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>Người bận</th>
                <th>Tên môn / Lý do bận</th>
                <th>Loại lịch</th>
                <th>Khoảng ngày áp dụng</th>
                <th>Khung giờ bận</th>
                <th>Thao tác</th>
              </tr>
            </thead>
            <tbody id="schedule-table-body">
              <tr><td colspan="6" style="text-align:center; color:var(--text-muted);">Đang tải danh sách lịch bận...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Add Schedule Modal -->
  <div id="add-schedule-modal" class="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Tạo Lịch Bận Mới</h3>
        <button class="modal-close" onclick="closeModal('add-schedule-modal')">&times;</button>
      </div>
      <form id="add-schedule-form">
        <div class="form-group">
          <label class="form-label" for="sched-subject">Tên môn học / Lý do bận *</label>
          <input type="text" id="sched-subject" class="form-control" placeholder="Ví dụ: Học Hệ điều hành / Bận thi Giữa kỳ" required>
        </div>

        <div class="form-group">
          <label class="form-label">Hình thức lịch bận</label>
          <div style="display:flex; gap:20px; margin-top:6px;">
            <label style="cursor:pointer; display:flex; align-items:center; gap:6px;">
              <input type="radio" name="sched-type" value="SPECIFIC" checked onchange="toggleScheduleTypeUI(this.value)"> Lịch ngày cụ thể
            </label>
            <label style="cursor:pointer; display:flex; align-items:center; gap:6px;">
              <input type="radio" name="sched-type" value="RECURRING" onchange="toggleScheduleTypeUI(this.value)"> Lặp lại hàng tuần (Học Kỳ)
            </label>
          </div>
        </div>

        <div id="recurring-days-group" class="form-group" style="display:none; background:rgba(255,255,255,0.03); padding:12px; border-radius:var(--radius-md);">
          <label class="form-label">Chọn các thứ lặp lại hàng tuần:</label>
          <div style="display:flex; flex-wrap:wrap; gap:12px; margin-top:8px;">
            <label><input type="checkbox" name="sched-dow" value="0"> T2</label>
            <label><input type="checkbox" name="sched-dow" value="1"> T3</label>
            <label><input type="checkbox" name="sched-dow" value="2"> T4</label>
            <label><input type="checkbox" name="sched-dow" value="3"> T5</label>
            <label><input type="checkbox" name="sched-dow" value="4"> T6</label>
            <label><input type="checkbox" name="sched-dow" value="5"> T7</label>
            <label><input type="checkbox" name="sched-dow" value="6"> CN</label>
          </div>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:14px;">
          <div class="form-group">
            <label class="form-label" for="sched-start-date">Từ ngày *</label>
            <input type="date" id="sched-start-date" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="sched-end-date">Đến ngày *</label>
            <input type="date" id="sched-end-date" class="form-control" required>
          </div>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:14px;">
          <div class="form-group">
            <label class="form-label" for="sched-start-time">Giờ bắt đầu *</label>
            <input type="time" id="sched-start-time" class="form-control" value="07:00" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="sched-end-time">Giờ kết thúc *</label>
            <input type="time" id="sched-end-time" class="form-control" value="11:30" required>
          </div>
        </div>

        <div style="margin-bottom:16px;">
          <button type="button" class="btn btn-sm btn-secondary" onclick="setAllDayTime()">⏱ Bận cả ngày (06:00 - 23:00)</button>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('add-schedule-modal')">Hủy</button>
          <button type="submit" class="btn btn-primary">Lưu Lịch Bận</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/schedule.js"></script>
</body>
</html>
